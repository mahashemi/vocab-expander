name: Website performance baseline

on:
  workflow_run:
    workflows: ["Deploy Persian Trainer to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: read

concurrency:
  group: website-performance-baseline
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Measure cold and warm desktop/mobile loads
        env:
          SITE_URL: https://mahashemi.github.io/vocab-expander/
        run: node tools/measure-site-performance.cjs

      - name: Smoke-test lazy term and feature routes
        env:
          SITE_URL: https://mahashemi.github.io/vocab-expander/
        run: node tools/test-lazy-loading.cjs

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: site-performance-baseline
          path: |
            reports/site-performance-baseline.json
            reports/site-performance-baseline.md
          if-no-files-found: error
          retention-days: 30
