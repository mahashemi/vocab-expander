name: All-term vocabulary audits

on:
  push:
    branches: [main]
    paths:
      - "website/term01-*.js"
      - "website/term02-*.js"
      - "website/term03-*.js"
      - "website/newestan-*.js"
      - "website/semantic-meanings.js"
      - "website/index.html"
      - "website/*.js"
      - "tools/audit-website-loading.cjs"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "study-materials/dars/term-03/**"
      - "tools/audit-term01.cjs"
      - "tools/audit-term02.cjs"
      - "tools/audit-term03.cjs"
      - "website/learning/**"
      - "tools/test-learning-*.cjs"
      - "tools/performance-budgets.cjs"
      - "tools/check-performance-budgets.cjs"
      - "tools/test-performance-budgets.cjs"
      - "tools/audit-newestan-all-terms.cjs"
      - "reports/newestan-all-terms-source-crosswalk-2026-11-27.md"
      - "website/learning/**"
      - "tools/test-learning-*.cjs"
      - "tools/performance-budgets.cjs"
      - "tools/check-performance-budgets.cjs"
      - "tools/test-performance-budgets.cjs"
      - "tools/audit-newestan-all-terms.cjs"
      - "reports/newestan-all-terms-source-crosswalk-2026-11-27.md"
      - ".github/workflows/audit-term01-term02.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/term01-*.js"
      - "website/term02-*.js"
      - "website/term03-*.js"
      - "website/newestan-*.js"
      - "website/semantic-meanings.js"
      - "website/index.html"
      - "website/*.js"
      - "tools/audit-website-loading.cjs"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "study-materials/dars/term-03/**"
      - "tools/audit-term01.cjs"
      - "tools/audit-term02.cjs"
      - "tools/audit-term03.cjs"
      - "website/learning/**"
      - "tools/test-learning-*.cjs"
      - "tools/performance-budgets.cjs"
      - "tools/check-performance-budgets.cjs"
      - "tools/test-performance-budgets.cjs"
      - "tools/audit-newestan-all-terms.cjs"
      - "reports/newestan-all-terms-source-crosswalk-2026-11-27.md"
      - ".github/workflows/audit-term01-term02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check all term JavaScript syntax
        run: |
          for file in website/term01-*.js website/term02-*.js website/term03-*.js; do
            node --check "$file"
          done
          node --check website/newestan-rubric.js
          node --check tools/audit-website-loading.cjs
          node --check tools/performance-budgets.cjs
          node --check tools/check-performance-budgets.cjs
          node --check tools/test-performance-budgets.cjs
          node --check tools/audit-newestan-all-terms.cjs
          for file in website/learning/*.js tools/test-learning-*.cjs; do node --check "$file"; done
          for file in website/learning/*.js tools/test-learning-*.cjs; do node --check "$file"; done

      - name: Audit website initial loading and script dependencies
        run: node tools/audit-website-loading.cjs

      - name: Upload website loading inventory
        uses: actions/upload-artifact@v4
        with:
          name: website-loading-inventory
          path: |
            reports/website-loading-inventory.json
            reports/website-loading-inventory.md
          if-no-files-found: error
          retention-days: 14

      - name: Test shared vocabulary learning modules
        run: |
          node tools/test-learning-identity.cjs
          node tools/test-learning-manifest.cjs
          node tools/test-learning-registry.cjs
          node tools/test-learning-progress-summary.cjs
          node tools/test-learning-modes.cjs
          node tools/test-learning-meaning.cjs
          node tools/test-learning-review.cjs
          node tools/test-performance-budgets.cjs
          node tools/audit-newestan-all-terms.cjs
          node tools/test-newestan-writing-worksheets.cjs
          node tools/test-newestan-writing-worksheets.cjs
          node tools/test-learning-imla-diagnostics.cjs

      - name: Run Term 01 audit
        run: node tools/audit-term01.cjs

      - name: Run Term 02 audit
        run: node tools/audit-term02.cjs

      - name: Run Term 03 audit
        run: node tools/audit-term03.cjs
