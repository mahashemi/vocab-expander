name: Term 01 and Term 02 content audits

on:
  push:
    branches: [main]
    paths:
      - "website/term01-*.js"
      - "website/term02-*.js"
      - "website/semantic-meanings.js"
      - "website/newestan-*.js"
      - "website/index.html"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "tools/audit-term01.cjs"
      - "tools/audit-term02.cjs"
      - ".github/workflows/audit-term01-term02.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/term01-*.js"
      - "website/term02-*.js"
      - "website/semantic-meanings.js"
      - "website/newestan-*.js"
      - "website/index.html"
      - "study-materials/dars/term-01/**"
      - "study-materials/dars/term-02/**"
      - "tools/audit-term01.cjs"
      - "tools/audit-term02.cjs"
      - ".github/workflows/audit-term01-term02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Term 01 and Term 02 JavaScript syntax
        run: |
          for file in website/term01-*.js website/term02-*.js; do
            node --check "$file"
          done

      - name: Run Term 01 deployment audit
        run: node tools/audit-term01.cjs

      - name: Run Term 02 deployment audit
        run: node tools/audit-term02.cjs
