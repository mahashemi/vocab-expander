name: Term 03 content audit

on:
  push:
    branches: [main]
    paths:
      - "website/term03-*.js"
      - "website/index.html"
      - "study-materials/dars/term-03/**"
      - "tools/audit-term03.cjs"
      - "tools/audit-term03-dedup.cjs"
      - "tools/report-term03-fa3-page1-gaps.cjs"
      - "tests/test_term03_content.py"
      - "TERM03_FIRST_PAGE_AUDIT.md"
      - ".github/workflows/audit-term03.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/term03-*.js"
      - "website/index.html"
      - "study-materials/dars/term-03/**"
      - "tools/audit-term03.cjs"
      - "tools/audit-term03-dedup.cjs"
      - "tools/report-term03-fa3-page1-gaps.cjs"
      - "tools/report-term03-fa3-reading-gaps.cjs"
      - "tests/test_term03_content.py"
      - "TERM03_FIRST_PAGE_AUDIT.md"
      - ".github/workflows/audit-term03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Term 03 JavaScript syntax
        run: |
          for file in website/term03-*.js; do
            node --check "$file"
          done
          node --check tools/report-term03-fa3-page1-gaps.cjs
          node --check tools/report-term03-fa3-reading-gaps.cjs

      - name: Run Term 03 deployment audit
        run: node tools/audit-term03.cjs

      - name: Generate Term 03 FA3 first-page OCR gap report
        run: node tools/report-term03-fa3-page1-gaps.cjs

      - name: Upload Term 03 FA3 gap report
        uses: actions/upload-artifact@v4
        with:
          name: term03-fa3-page1-gap-report
          path: |
            reports/term03-fa3-page1-gap-report.json
            reports/term03-fa3-page1-gap-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Generate Term 03 FA3 reading-passage gap report
        run: node tools/report-term03-fa3-reading-gaps.cjs

      - name: Upload Term 03 FA3 reading-passage gap report
        uses: actions/upload-artifact@v4
        with:
          name: term03-fa3-reading-gap-report
          path: |
            reports/term03-fa3-reading-gap-report.json
            reports/term03-fa3-reading-gap-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Run Term 03 deduplication runtime audit
        run: node tools/audit-term03-dedup.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Term 03 content tests
        run: python -m pytest -q tests/test_term03_content.py
